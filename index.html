<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Banco Sub-15</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F6F2;
    --surface:#FFFFFF;
    --surface-2:#E9EFE6;
    --ink:#12261C;
    --ink-dim:#516156;
    --line:#D3DED2;
    --accent:#E8600A;
    --accent-ink:#FFFFFF;
    --court:#1F7A4D;
    --court-ink:#FFFFFF;
    --yellow:#F4B400;
    --red:#D6392E;
    --bench:#7C8B80;
    --shadow: 0 1px 2px rgba(18,38,28,.06), 0 4px 14px rgba(18,38,28,.08);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1712;
      --surface:#16231C;
      --surface-2:#1D2C23;
      --ink:#EAF2EA;
      --ink-dim:#9DB0A3;
      --line:#2A3B30;
      --accent:#FF8A3D;
      --accent-ink:#1A0E00;
      --court:#2E9A63;
      --court-ink:#06180F;
      --yellow:#F7C948;
      --red:#F0564A;
      --bench:#5E7268;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1712;
    --surface:#16231C;
    --surface-2:#1D2C23;
    --ink:#EAF2EA;
    --ink-dim:#9DB0A3;
    --line:#2A3B30;
    --accent:#FF8A3D;
    --accent-ink:#1A0E00;
    --court:#2E9A63;
    --court-ink:#06180F;
    --yellow:#F7C948;
    --red:#F0564A;
    --bench:#5E7268;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Work Sans",system-ui,sans-serif;
    margin:0;
    padding:0 16px;
    padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));
    min-height:100%;
  }
  h1,h2,h3{font-family:"Oswald",system-ui,sans-serif; text-transform:uppercase; letter-spacing:.02em; margin:0;}
  .num{font-variant-numeric:tabular-nums;}
  button{font-family:inherit; -webkit-tap-highlight-color:transparent;}
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--bg);
    padding-top:12px; padding-bottom:8px;
    border-bottom:1px solid var(--line);
    margin:0 -16px; padding-left:16px; padding-right:16px;
  }
  .brand{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .brand h1{font-size:15px; color:var(--ink-dim); font-weight:600;}
  .brand .tag{font-size:11px; color:var(--ink-dim);}

  .tabs{display:flex; gap:6px; margin-top:10px;}
  .tab{
    flex:1; text-align:center; padding:9px 4px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-dim); font-weight:600; font-size:12.5px;
    letter-spacing:.02em; cursor:pointer;
  }
  .tab.active{background:var(--court); color:var(--court-ink); border-color:var(--court);}

  /* ---------- cards / sections ---------- */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px; box-shadow:var(--shadow); margin-top:14px;
  }
  .section-title{font-size:12px; color:var(--ink-dim); font-weight:600; letter-spacing:.08em; text-transform:uppercase; margin-bottom:10px;}
  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
  .field label{font-size:12px; color:var(--ink-dim); font-weight:600;}
  .field input, .field select{
    padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg);
    color:var(--ink); font-size:15px; width:100%;
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:11px 14px; border-radius:11px; font-weight:600; font-size:14px; cursor:pointer;
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn.ghost{background:transparent;}
  .btn.block{width:100%;}
  .btn.sm{padding:7px 10px; font-size:12.5px; border-radius:9px;}
  .btn:disabled{opacity:.4;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- scoreboard ---------- */
  .scoreboard{
    display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px;
    background:var(--court); color:var(--court-ink); border-radius:14px; padding:12px 14px;
  }
  .score-side{flex:1; text-align:center;}
  .score-side .lbl{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.85;}
  .score-side .val{font-family:"Oswald"; font-size:30px; font-weight:700; line-height:1;}
  .clock-mid{text-align:center; min-width:98px;}
  .clock-mid .time{font-family:"Oswald"; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums;}
  .clock-mid .state{font-size:10px; opacity:.85; text-transform:uppercase; letter-spacing:.06em;}
  .clock-btn{
    margin-top:4px; border:none; background:rgba(255,255,255,.18); color:var(--court-ink);
    padding:6px 12px; border-radius:20px; font-weight:700; font-size:12px; cursor:pointer;
  }
  .oppgoal{border:none; background:rgba(0,0,0,.15); color:var(--court-ink); border-radius:10px; padding:6px 8px; font-size:11px; font-weight:600; cursor:pointer;}

  /* ---------- action tray ---------- */
  .tray{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; gap:8px;
  }
  .tray .btn{flex:1;}

  /* ---------- player grids ---------- */
  .pgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px;}
  .pchip{
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:9px 8px;
    text-align:center; cursor:pointer; position:relative; min-height:74px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .pchip .n{font-family:"Oswald"; font-size:18px; font-weight:700; line-height:1;}
  .pchip .nm{font-size:11px; color:var(--ink-dim); line-height:1.2; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pchip .pos{font-size:8.5px; color:var(--ink-dim); letter-spacing:.05em; font-weight:700; opacity:.7; margin-top:1px;}
  .pchip .badges{position:absolute; top:4px; right:4px; display:flex; gap:2px;}
  .pchip .b{width:9px; height:12px; border-radius:2px;}
  .pchip .b.y{background:var(--yellow);}
  .pchip .b.r{background:var(--red);}
  .pchip .inj{position:absolute; bottom:4px; left:4px; font-size:13px;}
  .pchip .min{position:absolute; bottom:4px; right:6px; font-size:9.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums;}
  .pchip.selected{outline:2px solid var(--accent);}
  .pchip.dim{opacity:.45;}
  .checkbox-chip::before{
    content:""; position:absolute; top:5px; left:5px; width:14px; height:14px; border-radius:4px;
    border:1.5px solid var(--ink-dim); background:var(--surface);
  }
  .checkbox-chip.checked::before{background:var(--court); border-color:var(--court);}
  .checkbox-chip.checked::after{
    content:"✓"; position:absolute; top:4px; left:6px; font-size:12px; color:var(--court-ink); font-weight:700;
  }

  /* ---------- modal / bottom sheet ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,20,14,.5); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--surface); width:100%; max-width:520px; border-radius:18px 18px 0 0;
    padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px)); box-shadow:var(--shadow);
    max-height:85vh; overflow-y:auto;
  }
  .sheet h3{font-size:16px; margin-bottom:2px;}
  .sheet .sub{font-size:12px; color:var(--ink-dim); margin-bottom:12px;}
  .actiongrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
  .actiongrid .abtn{
    padding:14px 10px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2);
    font-weight:600; font-size:13.5px; text-align:left; cursor:pointer; color:var(--ink);
  }
  .actiongrid .abtn .ic{font-size:18px; display:block; margin-bottom:4px;}
  .abtn.yellow{background:color-mix(in srgb, var(--yellow) 22%, var(--surface));}
  .abtn.red{background:color-mix(in srgb, var(--red) 20%, var(--surface)); color:var(--red);}
  .abtn.stop{background:color-mix(in srgb, var(--ink-dim) 18%, var(--surface));}

  /* ---------- log ---------- */
  .logline{display:flex; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; align-items:flex-start;}
  .logline:last-child{border-bottom:none;}
  .logline .t{font-variant-numeric:tabular-nums; color:var(--ink-dim); min-width:46px; font-size:12px; padding-top:1px;}
  .logline .d{flex:1;}
  .logline .u{background:none; border:none; color:var(--ink-dim); font-size:12px; text-decoration:underline; cursor:pointer;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th,td{text-align:left; padding:7px 6px; border-bottom:1px solid var(--line);}
  th{color:var(--ink-dim); font-weight:600; text-transform:uppercase; font-size:10.5px; letter-spacing:.04em;}
  td.num, th.num{text-align:center; font-variant-numeric:tabular-nums;}
  .tablewrap{overflow-x:auto; margin-top:6px;}

  textarea.exportbox{
    width:100%; min-height:140px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-family:ui-monospace,Menlo,monospace; font-size:11.5px; padding:10px;
  }
  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:60;
    background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:20px; font-size:13px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{opacity:1;}
  .empty{color:var(--ink-dim); font-size:13px; text-align:center; padding:18px 8px;}
  .pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:600; background:var(--surface-2); color:var(--ink-dim);}
  .hint{font-size:11.5px; color:var(--ink-dim); line-height:1.4; margin-top:6px;}
  .list-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .list-row .lname{font-weight:600; font-size:14px;}
  .list-row .lsub{font-size:11.5px; color:var(--ink-dim);}
</style>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Banco Sub-15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F7A4D">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <h1>⚽ Banco — Sub‑15 Futsal</h1>
    <span class="tag" id="offlineTag">tudo guardado neste telemóvel</span>
  </div>
  <div class="tabs">
    <div class="tab" data-tab="plantel">Plantel</div>
    <div class="tab" data-tab="prejogo">Pré‑Jogo</div>
    <div class="tab" data-tab="jogo">Jogo</div>
    <div class="tab" data-tab="resumo">Resumo</div>
  </div>
</div>

<div id="view"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "futsalBancoSub15.v1";
  var uid = function(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); };

  var POSITIONS = ["Guarda-Redes","Fixo","Ala","Pivô","Universal"];
  var POS_ABBR = {"Guarda-Redes":"GR","Fixo":"FX","Ala":"AL","Pivô":"PV","Universal":"UN"};
  function isGoleiro(p){ return !!p && p.pos === "Guarda-Redes"; }
  function periodLabel(n){
    n = n||1;
    if(n===1) return "1ª Parte";
    if(n===2) return "2ª Parte";
    if(n===3) return "Prolongamento 1";
    if(n===4) return "Prolongamento 2";
    return n+"ª Parte";
  }

  var defaultState = function(){ return {
    activeTab: "plantel",
    roster: [],            // {id, num, name, pos}
    match: null,           // {id, jornada, date, adversario, local, convocadoIds:[]}
    started: false,        // kickoff happened at least once
    finished: false,
    onCourt: [],           // player ids currently on court
    onCourtSince: {},      // playerId -> ms mark (period clock time) when came on, while clock running
    secondsPlayed: {},     // playerId -> accumulated seconds (soma de todas as partes)
    events: [],            // chronological event log
    clock: { running:false, elapsedMs:0, startTs:null },
    period: 1,             // parte atual (1ª, 2ª, prolongamentos...)
    score: { nos:0, advers:0 },
    treatment: null,       // {playerId, startedAtMs}
    periodFouls: 0,
    history: []            // archived past matches: {match, rows:[...], events, finishedAt}
  };};

  var state = load();

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var base = defaultState();
      var merged = Object.assign(base, parsed);
      // migração: jogadores/jogos gravados antes de existir "posição"/"parte"
      (merged.roster||[]).forEach(function(p){ if(!p.pos) p.pos = "Universal"; });
      if(!merged.period) merged.period = 1;
      return merged;
    }catch(e){ return defaultState(); }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ /* localStorage indisponível — a app continua a funcionar só nesta sessão */ }
  }

  // ---------- undo stack (closures, not persisted) ----------
  var undoStack = [];
  function pushUndo(fn){ undoStack.push(fn); if(undoStack.length>25) undoStack.shift(); }
  function doUndo(){
    var fn = undoStack.pop();
    if(!fn){ toast("Nada para desfazer"); return; }
    fn();
    save(); render();
    toast("Última ação desfeita");
  }

  // ---------- clock helpers ----------
  function nowElapsedMs(){
    return state.clock.running ? state.clock.elapsedMs + (Date.now() - state.clock.startTs) : state.clock.elapsedMs;
  }
  function settlePlayer(id, atMs){
    if(state.onCourtSince[id] != null){
      state.secondsPlayed[id] = (state.secondsPlayed[id]||0) + Math.max(0,(atMs - state.onCourtSince[id]))/1000;
      delete state.onCourtSince[id];
    }
  }
  function settleAll(atMs){ state.onCourt.forEach(function(id){ settlePlayer(id, atMs); }); }
  function markOnSince(id, atMs){ state.onCourtSince[id] = atMs; }

  function hasKickoffThisPeriod(){
    return state.events.some(function(e){ return e.type==="kickoff" && e.period===state.period; });
  }
  function clockButtonLabel(){
    if(state.clock.running) return "Pausar";
    if(hasKickoffThisPeriod()) return "Retomar";
    return state.period<=1 ? "Iniciar Jogo" : "Iniciar "+periodLabel(state.period);
  }

  // Pausar SEMPRE pede motivo (pedido de tempo ou outro) — jogo é a tempo corrido,
  // por isso qualquer paragem tem de ficar justificada no registo.
  var PAUSE_REASONS = [
    {id:"tempo_nos", label:"Pedido de Tempo — Nós"},
    {id:"tempo_advers", label:"Pedido de Tempo — Adversário"},
    {id:"outro", label:"Outro motivo (lesão, árbitro, etc.)"}
  ];
  function requestPause(){
    if(!state.clock.running){ resumeOrStart(); return; }
    openSheet(
      '<h3>Motivo da pausa</h3><div class="sub">O relógio só para com um motivo registado</div>'+
      '<div class="actiongrid">'+PAUSE_REASONS.map(function(r){
        return '<button class="abtn" data-reason="'+r.id+'">'+esc(r.label)+'</button>';
      }).join("")+'</div>'+
      '<div class="btn-row" style="margin-top:14px;"><button class="btn ghost block" data-act="fechar">Cancelar</button></div>',
      function(sheet){
        sheet.addEventListener("click", function(e){
          var b = e.target.closest("[data-reason]");
          if(b){ doPause(b.getAttribute("data-reason")); closeSheet(); return; }
          if(e.target.closest("[data-act='fechar']")) closeSheet();
        });
      }
    );
  }
  function doPause(reasonId){
    var reason = PAUSE_REASONS.find(function(r){return r.id===reasonId;});
    var atMs = nowElapsedMs();
    state.clock.elapsedMs = atMs;
    state.clock.running = false;
    state.clock.startTs = null;
    settleAll(atMs);
    logEvent("pausa", null, {label:"Pausa — "+(reason?reason.label:"Outro motivo"), reasonId: reasonId});
    save(); render();
  }
  function resumeOrStart(){
    var atMs = nowElapsedMs();
    state.clock.running = true;
    state.clock.startTs = Date.now();
    state.onCourt.forEach(function(id){ markOnSince(id, atMs); });
    state.started = true;
    var label = hasKickoffThisPeriod() ? "Relógio retomado" : ("Início da "+periodLabel(state.period));
    logEvent("kickoff", null, {label: label});
    save(); render();
  }
  function toggleClock(){ requestPause(); }

  // Termina a parte atual: assenta os tempos de jogo, regista o fim, e zera
  // o relógio para a parte seguinte começar do 00:00.
  function endPeriod(){
    var atMs = nowElapsedMs();
    if(state.clock.running){
      state.clock.elapsedMs = atMs;
      state.clock.running = false;
      state.clock.startTs = null;
      settleAll(atMs);
    }
    logEvent("fim_periodo", null, {label:"Fim da "+periodLabel(state.period), duracaoSec: Math.round(atMs/1000)});
    state.clock.elapsedMs = 0;
    state.period = (state.period||1) + 1;
    state.periodFouls = 0;
    save(); render();
    toast(periodLabel(state.period)+" pronta a começar — relógio a 00:00");
  }

  function playerSeconds(id){
    var base = state.secondsPlayed[id] || 0;
    if(state.onCourtSince[id] != null){ base += Math.max(0,(nowElapsedMs() - state.onCourtSince[id]))/1000; }
    return base;
  }
  function fmtMinSec(ms){
    var totalSec = Math.floor(ms/1000);
    var m = Math.floor(totalSec/60), s = totalSec%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }
  function matchMinute(){ return Math.floor(nowElapsedMs()/60000); }

  // ---------- roster helpers ----------
  function playerById(id){ return state.roster.find(function(p){return p.id===id;}); }
  function convocados(){
    if(!state.match) return [];
    return state.match.convocadoIds.map(playerById).filter(Boolean);
  }
  function benchIds(){
    if(!state.match) return [];
    return state.match.convocadoIds.filter(function(id){ return state.onCourt.indexOf(id)===-1; });
  }

  function logEvent(type, playerId, extra){
    var ms = nowElapsedMs();
    var ev = Object.assign({
      id: uid(), type: type, playerId: playerId||null,
      ms: ms, min: Math.floor(ms/60000), sec: Math.floor((ms%60000)/1000),
      period: state.period||1,
      ts: Date.now(), clockTime: new Date().toISOString()
    }, extra||{});
    state.events.push(ev);
    return ev;
  }
  function eventMs(e){ return (e.ms!=null) ? e.ms : (e.min||0)*60000 + (e.sec||0)*1000; }
  function eventStamp(e){ return periodLabel(e.period||1)+" · "+fmtMinSec(eventMs(e)); }

  // ================= ACTIONS =================
  function addPlayer(num, name, pos){
    name = (name||"").trim();
    if(!name) return;
    pos = POSITIONS.indexOf(pos)>-1 ? pos : "Universal";
    state.roster.push({id:uid(), num:(num||"").toString().trim(), name:name, pos:pos});
    save(); render();
  }

  // ---------- Importar plantel a partir do workbook (fonte única de verdade) ----------
  function normPos(s){
    return (s||"").toString().trim().toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^a-z]/g,"");
  }
  var POS_NORM_MAP = (function(){
    var m = {};
    POSITIONS.forEach(function(p){ m[normPos(p)] = p; });
    // Aceita também as abreviaturas usadas no plantel.csv (GR, FX, AL, PV, UN)
    // e algumas variantes escritas sem hífen/acento.
    Object.keys(POS_ABBR).forEach(function(full){ m[normPos(POS_ABBR[full])] = full; });
    m[normPos("Guarda Redes")] = "Guarda-Redes";
    m[normPos("Guardaredes")] = "Guarda-Redes";
    m[normPos("Goleiro")] = "Guarda-Redes";
    m[normPos("Pivo")] = "Pivô";
    return m;
  })();
  function guessPosition(fields){
    for(var i=2;i<fields.length;i++){
      var np = normPos(fields[i]);
      if(POS_NORM_MAP[np]) return POS_NORM_MAP[np];
    }
    return "Universal";
  }
  // Atualiza/acrescenta a partir do texto colado (linhas do Excel). NUNCA remove
  // ninguém sozinho — isso continua a ser uma ação manual (botão Remover), para
  // não perder o histórico de jogos já registados com esse atleta.
  //
  // Casa atletas existentes só pelo NOME (não pelo número). Casar também pelo
  // número parecia razoável, mas se o ficheiro de origem tiver dois atletas
  // diferentes com o mesmo número (por engano), o segundo "engolia" o primeiro
  // silenciosamente — perdia-se um atleta sem aviso nenhum. Casar só pelo nome
  // é mais seguro: na pior hipótese cria uma entrada a mais (fácil de ver e
  // remover à mão), nunca apaga um atleta sem se dar por isso.
  function importRosterFromText(text, opts){
    opts = opts || {};
    var lines = (text||"").split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
    var added=0, updated=0, skipped=0;
    lines.forEach(function(line){
      var fields = (line.indexOf("\t")>-1 ? line.split("\t") : line.split(",")).map(function(f){return (f||"").trim();});
      if(fields.length<2){ skipped++; return; }
      var numRaw = fields[0], nome = fields[1];
      if(/^n[º°o]?$/i.test(numRaw) || /^nome/i.test(nome)){ return; } // cabeçalho
      if(!nome){ skipped++; return; }
      var pos = guessPosition(fields);
      var existing = state.roster.find(function(p){
        return p.name.toLowerCase()===nome.toLowerCase();
      });
      if(existing){
        existing.num = numRaw || existing.num;
        existing.name = nome;
        existing.pos = pos;
        updated++;
      } else {
        state.roster.push({id:uid(), num:numRaw, name:nome, pos:pos});
        added++;
      }
    });
    save();
    // Aviso: dois atletas diferentes a partilhar o mesmo número — não é erro
    // técnico, mas quase de certeza um engano no plantel.csv/Excel.
    var numCounts = {};
    state.roster.forEach(function(p){
      if(!p.num) return;
      (numCounts[p.num] = numCounts[p.num]||[]).push(p.name);
    });
    var dupNums = Object.keys(numCounts).filter(function(n){ return numCounts[n].length>1; });
    render();
    var changed = added+updated;
    if(opts.silent){
      if(changed>0) toast("Plantel sincronizado do GitHub ("+changed+" alteração/ões)"+(dupNums.length?" — ⚠️ números repetidos":""));
    } else {
      toast(added+" novo(s), "+updated+" atualizado(s)"+(skipped?(", "+skipped+" ignorada(s)"):"")+(dupNums.length?(" — ⚠️ nº repetido: "+dupNums.join(", ")):""));
    }
    return {added:added, updated:updated, skipped:skipped, dupNums:dupNums};
  }

  // Plantel vive também no repositório GitHub (plantel.csv) — a app tenta
  // sincronizar sozinha quando há rede, sem precisar de copiar/colar.
  var PLANTEL_SYNC_URL = "https://antunhag.github.io/AAL-NEW/plantel.csv";
  function syncPlantelFromGithub(manual){
    if(!PLANTEL_SYNC_URL){ if(manual) toast("Sincronização não configurada"); return; }
    fetch(PLANTEL_SYNC_URL, {cache:"no-store"})
      .then(function(resp){
        if(!resp.ok) throw new Error("HTTP "+resp.status);
        return resp.text();
      })
      .then(function(text){ importRosterFromText(text, {silent:!manual}); })
      .catch(function(){
        if(manual) toast("Não consegui sincronizar agora (sem rede ou ficheiro indisponível)");
      });
  }
  function removePlayer(id){
    if(state.match && state.match.convocadoIds.indexOf(id)>-1){ toast("Já está convocado — remove da convocatória primeiro"); return; }
    state.roster = state.roster.filter(function(p){return p.id!==id;});
    save(); render();
  }

  function ensureMatch(){
    if(!state.match){
      state.match = {id:uid(), jornada:"", date:"", adversario:"", local:"", convocadoIds:[]};
    }
  }
  function toggleConvocado(id){
    ensureMatch();
    var idx = state.match.convocadoIds.indexOf(id);
    if(idx>-1) state.match.convocadoIds.splice(idx,1);
    else state.match.convocadoIds.push(id);
    save(); render();
  }
  function toggleTitular(id){
    if(state.started){ toast("O jogo já começou — usa Substituir"); return; }
    var idx = state.onCourt.indexOf(id);
    if(idx>-1) state.onCourt.splice(idx,1);
    else {
      if(state.onCourt.length>=5){ toast("Já tens 5 titulares em quadra"); return; }
      state.onCourt.push(id);
    }
    save(); render();
  }

  function startMatchInfo(field, value){
    ensureMatch();
    state.match[field] = value;
    save();
  }

  // O placar NUNCA é um contador à parte — é sempre recalculado a partir dos
  // eventos "golo"/"golo_sofrido". Assim, adicionar, apagar ou corrigir um golo
  // (mesmo um esquecido, registado depois) atualiza o placar sozinho e não há
  // como o placar e o registo cronológico ficarem dessincronizados.
  function recomputeScoreFor(events){
    return {
      nos: events.filter(function(e){return e.type==="golo";}).length,
      advers: events.filter(function(e){return e.type==="golo_sofrido";}).length
    };
  }
  function doGoal(scorerId, assistId){
    var lineup = state.onCourt.slice();
    var ev = logEvent("golo", scorerId, {assistId: assistId||null, lineup: lineup});
    state.score = recomputeScoreFor(state.events);
    pushUndo(function(){
      state.events = state.events.filter(function(e){return e.id!==ev.id;});
      state.score = recomputeScoreFor(state.events);
    });
    save(); render();
    toast("Golo registado ⚽");
  }
  function doOppGoal(){
    var ev = logEvent("golo_sofrido", null, {});
    state.score = recomputeScoreFor(state.events);
    pushUndo(function(){
      state.events = state.events.filter(function(e){return e.id!==ev.id;});
      state.score = recomputeScoreFor(state.events);
    });
    save(); render();
  }
  function doCard(playerId, kind){ // kind: 'amarelo' | 'vermelho'
    var ev = logEvent(kind==='amarelo'?'cartao_amarelo':'cartao_vermelho', playerId, {});
    var wasOnCourt = state.onCourt.indexOf(playerId)>-1;
    pushUndo(function(){
      state.events = state.events.filter(function(e){return e.id!==ev.id;});
      if(kind==='vermelho' && wasOnCourt && state.onCourt.indexOf(playerId)===-1){
        state.onCourt.push(playerId);
        if(state.clock.running) markOnSince(playerId, nowElapsedMs());
      }
    });
    if(kind==='vermelho' && wasOnCourt){
      var atMs = nowElapsedMs();
      if(state.clock.running) settlePlayer(playerId, atMs);
      state.onCourt = state.onCourt.filter(function(id){return id!==playerId;});
    }
    save(); render();
    toast(kind==='amarelo'?"Cartão amarelo registado":"Cartão vermelho registado");
  }
  function doFoul(playerId){
    state.periodFouls++;
    var ev = logEvent("falta", playerId, {});
    pushUndo(function(){
      state.periodFouls = Math.max(0,state.periodFouls-1);
      state.events = state.events.filter(function(e){return e.id!==ev.id;});
    });
    save(); render();
  }
  function startTreatment(playerId){
    if(state.treatment){ toast("Já há um atendimento em curso"); return; }
    state.treatment = {playerId: playerId, startedAtMs: nowElapsedMs()};
    logEvent("lesao_inicio", playerId, {});
    save(); render();
  }
  function endTreatment(){
    if(!state.treatment) return;
    var durSec = Math.max(0,(nowElapsedMs() - state.treatment.startedAtMs)/1000);
    logEvent("lesao_fim", state.treatment.playerId, {durSec: Math.round(durSec)});
    state.treatment = null;
    save(); render();
    toast("Atendimento terminado");
  }
  function doSub(outId, inId){
    var atMs = nowElapsedMs();
    if(state.clock.running){
      settlePlayer(outId, atMs);
      markOnSince(inId, atMs);
    }
    state.onCourt = state.onCourt.filter(function(id){return id!==outId;});
    state.onCourt.push(inId);
    var ev = logEvent("substituicao", inId, {outId: outId});
    pushUndo(function(){
      state.events = state.events.filter(function(e){return e.id!==ev.id;});
      var atMs2 = nowElapsedMs();
      if(state.clock.running){ settlePlayer(inId, atMs2); markOnSince(outId, atMs2); }
      state.onCourt = state.onCourt.filter(function(id){return id!==inId;});
      state.onCourt.push(outId);
    });
    save(); render();
    toast("Substituição registada");
  }

  function archiveMatch(){
    var rows = buildRows();
    state.history.push({
      id: uid(), match: state.match, rows: rows, events: state.events,
      score: {nos: state.score.nos, advers: state.score.advers},
      finishedAt: Date.now()
    });
    // reset live state, keep roster + history
    var keepRoster = state.roster;
    var keepHistory = state.history;
    var fresh = defaultState();
    fresh.roster = keepRoster;
    fresh.history = keepHistory;
    fresh.activeTab = "prejogo";
    state = fresh;
    save(); render();
    toast("Jogo guardado no histórico");
  }

  // ================= EXPORT =================
  function buildRows(){
    var jornada = state.match ? state.match.jornada : "";
    var date = state.match ? state.match.date : "";
    var adv = state.match ? state.match.adversario : "";
    var starters = {};
    state.events.filter(function(e){return e.type==='kickoff';}).slice(0,1); // marker only
    // titulares = quem estava onCourt no primeiro kickoff -> aproximamos: quem tem tempo>0 antes da primeira substituição
    // Estratégia simples e robusta: guardamos titulares explicitamente no início do jogo:
    var titularIds = state.titularIds || [];
    return convocados().map(function(p){
      var golos = state.events.filter(function(e){return e.type==='golo' && e.playerId===p.id;}).length;
      var assist = state.events.filter(function(e){return e.type==='golo' && e.assistId===p.id;}).length;
      var ca = state.events.filter(function(e){return e.type==='cartao_amarelo' && e.playerId===p.id;}).length;
      var cv = state.events.filter(function(e){return e.type==='cartao_vermelho' && e.playerId===p.id;}).length;
      var min = Math.round(playerSeconds(p.id)/60);
      return {
        jornada:jornada, date:date, adversario:adv, num:p.num, nome:p.name,
        convocado:"Sim", titular: (titularIds.indexOf(p.id)>-1)?"Sim":"Não",
        min:min, golos:golos, assist:assist, ca:ca, cv:cv
      };
    });
  }

  function exportText(source){
    // source opcional: {rows, events, score} — usado para reexportar um jogo do histórico.
    var rows = (source && source.rows) || buildRows();
    var events = (source && source.events) || state.events;
    var score = (source && source.score) || state.score;
    var lines = [];
    lines.push("REGISTO DE JOGO — cole estas linhas na folha \"Jogo - Registo\" (uma por atleta)");
    lines.push("Jornada\tData\tAdversário\tAtleta\tConvocado?\tTitular?\tMinutos Jogados\tGolos\tAssistências\tCartão Amarelo\tCartão Vermelho\tNotas");
    rows.forEach(function(r){
      lines.push([r.jornada,r.date,r.adversario,r.nome,r.convocado,r.titular,r.min,r.golos,r.assist,r.ca,r.cv,""].join("\t"));
    });
    lines.push("");
    lines.push("Resultado: Nós "+score.nos+" - "+score.advers+" Adversário");
    lines.push("");
    lines.push("REGISTO CRONOLÓGICO (golos, cartões, faltas, atendimentos, substituições)");
    events.forEach(function(e){ lines.push(describeEvent(e)); });
    return lines.join("\n");
  }

  function describeEvent(e){
    var p = e.playerId ? playerById(e.playerId) : null;
    var pname = p ? ("#"+p.num+" "+p.name) : "";
    var t = "["+eventStamp(e)+"] ";
    var body;
    switch(e.type){
      case "kickoff": body = (e.label||"Início/retoma do relógio"); break;
      case "pausa": body = (e.label||"Pausa"); break;
      case "fim_periodo": body = (e.label||"Fim da parte")+" ("+fmtMinSec((e.duracaoSec||0)*1000)+" jogados)"; break;
      case "golo":
        var assistP = e.assistId ? playerById(e.assistId) : null;
        var lineupNames = (e.lineup||[]).map(function(id){var pp=playerById(id); return pp? "#"+pp.num : "?";}).join(",");
        body = "GOLO — "+pname+(assistP? (" (assist. #"+assistP.num+" "+assistP.name+")"):"")+(lineupNames? (" | em quadra: "+lineupNames):"");
        break;
      case "golo_sofrido": body = "Golo sofrido (adversário)"; break;
      case "cartao_amarelo": body = "Cartão amarelo — "+pname; break;
      case "cartao_vermelho": body = "Cartão vermelho — "+pname; break;
      case "falta": body = "Falta — "+pname; break;
      case "lesao_inicio": body = "Atendimento iniciado — "+pname; break;
      case "lesao_fim": body = "Atendimento terminado — "+pname+" ("+Math.round((e.durSec||0)/60*10)/10+" min)"; break;
      case "substituicao":
        var outP = e.outId ? playerById(e.outId) : null;
        body = "Substituição — entra "+pname+(outP? (", sai #"+outP.num+" "+outP.name):"");
        break;
      default: body = e.type;
    }
    if(e.correcao) body += (e.aproximado ? " [correção — momento aproximado]" : " [correção]");
    return t+body;
  }

  // ---------- Correções (golos/cartões/faltas esquecidos, ou registados por engano) ----------
  // Um evento de correção é igual a um evento normal, mas com correcao:true e um
  // momento (parte + minuto:segundo) escolhido manualmente, já que não foi capturado
  // ao vivo. Funciona tanto no jogo em curso como num jogo já arquivado no histórico.
  function addCorrectionEvent(target, typeId, playerId, assistId, period, min, sec, approx){
    var typeMap = {
      golo_nos: "golo", golo_advers: "golo_sofrido",
      cartao_amarelo: "cartao_amarelo", cartao_vermelho: "cartao_vermelho", falta: "falta"
    };
    var type = typeMap[typeId];
    if(!type) return null;
    var ms = (min||0)*60000 + (sec||0)*1000;
    var ev = {
      id: uid(), type: type, playerId: playerId||null,
      ms: ms, min: min||0, sec: sec||0, period: period||1,
      ts: Date.now(), clockTime: new Date().toISOString(),
      correcao: true, aproximado: !!approx
    };
    if(type==="golo" && assistId) ev.assistId = assistId;
    target.events.push(ev);
    return ev;
  }
  // Recalcula golos/assistências/cartões de um jogo já arquivado a partir dos seus
  // eventos (os minutos jogados e titularidade ficam como estavam — não são
  // recuperáveis com precisão depois do jogo arquivado, por isso não se mexe neles).
  function rebuildHistoryRows(h){
    h.rows = h.rows.map(function(r){
      var p = state.roster.find(function(pp){ return pp.num===r.num && pp.name===r.nome; });
      if(!p) return r;
      return Object.assign({}, r, {
        golos: h.events.filter(function(e){return e.type==='golo' && e.playerId===p.id;}).length,
        assist: h.events.filter(function(e){return e.type==='golo' && e.assistId===p.id;}).length,
        ca: h.events.filter(function(e){return e.type==='cartao_amarelo' && e.playerId===p.id;}).length,
        cv: h.events.filter(function(e){return e.type==='cartao_vermelho' && e.playerId===p.id;}).length
      });
    });
  }

        '<option value="golo_nos">Golo — Nós</option>'+

      '<div class="field" id="corrPlayerField"><label>Atleta</label><select id="corrPlayer">'+playersOptions+'</select></div>'+
      '<div class="field" id="corrAssistField"><label>Assistência (opcional)</label><select id="corrAssist"><option value="">—</option>'+playersOptions+'</select></div>'+
      '<div class="row2">'+
        '<div class="field"><label>Parte</label><select id="corrPeriod">'+periodOptions.join("")+'</select></div>'+
        '<div class="field"><label>Momento (MM:SS)</label><div style="display:flex;gap:6px;">'+
          '<input id="corrMin" type="number" min="0" placeholder="MM" style="width:70px;">'+
          '<input id="corrSec" type="number" min="0" max="59" placeholder="SS" style="width:70px;">'+

  function openCorrectionSheet(){
    if(!state.match){ toast("Sem jogo ativo"); return; }
    openCorrectionSheetGeneric({
      title: "Corrigir jogo em curso",
      sub: "Adiciona um golo/cartão/falta esquecido, ou apaga um registo errado. O placar atualiza-se sozinho.",
      players: convocados(),
      maxPeriod: Math.max(state.period||1, 2),
      events: state.events,
      onAdd: function(t, playerId, assistId, period, min, sec, approx){
        addCorrectionEvent(state, t, playerId, assistId, period, min, sec, approx);
        state.score = recomputeScoreFor(state.events);
        save(); render();
        toast("Correção adicionada");
        openCorrectionSheet();
      },
      onDelete: function(evId){
        state.events = state.events.filter(function(e){ return e.id!==evId; });
        state.score = recomputeScoreFor(state.events);
        save(); render();
        toast("Evento apagado");
        openCorrectionSheet();
      },
      onClose: function(){ closeSheet(); render(); }
    });
  }

  function openHistoryCorrectionSheet(histId){
    var h = state.history.find(function(x){ return x.id===histId; });
    if(!h){ toast("Não encontrei esse jogo"); return; }
    var maxPeriod = h.events.reduce(function(m,e){ return Math.max(m, e.period||1); }, 2);
    openCorrectionSheetGeneric({
      title: "Corrigir — "+(h.match.adversario||"Jogo"),
      sub: "Este jogo já está no histórico — as alterações ficam guardadas no registo arquivado.",
      players: (h.match.convocadoIds||[]).map(playerById).filter(Boolean),
      maxPeriod: maxPeriod,
      events: h.events,
      onAdd: function(t, playerId, assistId, period, min, sec, approx){
        addCorrectionEvent(h, t, playerId, assistId, period, min, sec, approx);
        h.score = recomputeScoreFor(h.events);
        rebuildHistoryRows(h);
        save();
        toast("Correção adicionada");
        openHistoryCorrectionSheet(histId);
      },
      onDelete: function(evId){
        h.events = h.events.filter(function(e){ return e.id!==evId; });
        h.score = recomputeScoreFor(h.events);
        rebuildHistoryRows(h);
        save();
        toast("Evento apagado");
        openHistoryCorrectionSheet(histId);
      },
      onClose: function(){ openHistorySheet(histId); }
    });
  }

  function copyTextToClipboard(text, targetTextareaId){
    var ta = targetTextareaId ? document.getElementById(targetTextareaId) : null;
    if(ta) ta.value = text;
    var done = function(){ toast("Copiado! Cola no chat com o Claude"); };
    var fail = function(){ toast("Não copiou automaticamente — seleciona o texto abaixo e copia"); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, function(){
          fallbackCopy(text) ? done() : fail();
        });
      } else { fallbackCopy(text) ? done() : fail(); }
    }catch(e){ fallbackCopy(text) ? done() : fail(); }
  }
  function fallbackCopy(text){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }
  function copyExport(){ copyTextToClipboard(exportText(), "exportArea"); }

  // Descarrega um ficheiro. Dentro do Claude usa o mecanismo de downloads do
  // artefacto. Fora dele, no Safari/iOS (sobretudo em app instalada), o
  // atributo "download" de um link para um blob costuma ser ignorado — o
  // telemóvel acaba por guardar a própria página da app (ex.: "Banco Sub-15.html")
  // em vez do ficheiro pretendido. A API de partilha do sistema (Partilhar/
  // Guardar em Ficheiros) dá controlo real do nome e funciona de forma fiável
  // no iOS, por isso é tentada primeiro fora do Claude; o link para blob fica
  // como alternativa para desktop/Android.
  async function downloadFile(content, fname, mime){
    try{
      if(window.claude && window.claude.use){
        var dl = await window.claude.use("downloads");
        if(dl){ await dl.save({filename: fname, data: content}); return; }
      }
      var blob = new Blob([content], {type: mime || "text/plain;charset=utf-8"});
      if(navigator.share && navigator.canShare){
        try{
          var file = new File([blob], fname, {type: blob.type});
          if(navigator.canShare({files: [file]})){
            await navigator.share({files: [file], title: fname});
            return;
          }
        }catch(shareErr){ /* cancelado ou não suportado — usa o método seguinte */ }
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }catch(e){ toast("Não foi possível descarregar agora"); }
  }
  function downloadText(text, fname){ return downloadFile(text, fname, "text/plain;charset=utf-8"); }
  function downloadCsv(){
    var fname = "jogo_"+(state.match&&state.match.adversario? state.match.adversario.replace(/\s+/g,"_"):"registo")+".txt";
    downloadText(exportText(), fname);
  }

  // ---------- Backup completo (plantel + jogo em curso + histórico) ----------
  // Os dados vivem só no armazenamento deste telemóvel/navegador (localStorage).
  // Um novo deploy dos ficheiros no GitHub Pages NUNCA apaga isto — mas reinstalar
  // a app (remover o ícone do ecrã principal e adicionar de novo) ou o telemóvel
  // limpar dados do site apaga, sim. Por isso convém descarregar um backup depois
  // de cada jogo.
  function downloadBackup(){
    var fname = "banco_sub15_backup_"+new Date().toISOString().slice(0,10)+".json";
    downloadFile(JSON.stringify(state, null, 2), fname, "application/json");
    toast("Backup descarregado");
  }
  function importBackupFromText(text){
    try{
      var parsed = JSON.parse(text);
      if(!parsed || typeof parsed!=="object" || !Array.isArray(parsed.roster)){
        toast("Ficheiro inválido — não parece um backup desta app");
        return;
      }
      var base = defaultState();
      state = Object.assign(base, parsed);
      (state.roster||[]).forEach(function(p){ if(!p.pos) p.pos = "Universal"; });
      if(!state.period) state.period = 1;
      save(); render();
      toast("Backup restaurado — "+(state.history||[]).length+" jogo(s) no histórico");
    }catch(e){ toast("Não consegui ler este ficheiro — confirma que é um backup exportado pela app"); }
  }
  function confirmRestoreBackup(text){
    openSheet(
      '<h3>Restaurar backup?</h3>'+
      '<div class="sub">Isto substitui TODOS os dados atuais desta app (plantel, jogo em curso e histórico) pelo conteúdo do ficheiro. Não pode ser desfeito.</div>'+
      '<div class="btn-row" style="margin-top:14px;"><button class="btn primary block" data-act="confirmar">Substituir e restaurar</button></div>'+
      '<div class="btn-row" style="margin-top:8px;"><button class="btn ghost block" data-act="cancelar">Cancelar</button></div>',
      function(sheet){
        sheet.addEventListener("click", function(e){
          if(e.target.closest("[data-act='confirmar']")){ importBackupFromText(text); closeSheet(); }
          if(e.target.closest("[data-act='cancelar']")) closeSheet();
        });
      }
    );
  }

  // Executa a troca, mas se guarda-redes<->jogador de campo, pede confirmação primeiro.
  function attemptSub(outId, inId){
    var outP = playerById(outId), inP = playerById(inId);
    if(outP && inP && isGoleiro(outP) !== isGoleiro(inP)){
      openSheet(
        '<h3>Confirmar troca de posição?</h3>'+
        '<div class="sub">Sai #'+esc(outP.num)+' '+esc(outP.name)+' ('+esc(outP.pos)+') — entra #'+esc(inP.num)+' '+esc(inP.name)+' ('+esc(inP.pos)+'). '+
        (isGoleiro(outP) ? 'Vais ficar sem guarda-redes em quadra.' : 'Vais colocar um guarda-redes a jogar como jogador de campo.')+'</div>'+
        '<div class="btn-row" style="margin-top:14px;"><button class="btn primary block" data-act="confirmar">Confirmar mesmo assim</button></div>'+
        '<div class="btn-row" style="margin-top:8px;"><button class="btn ghost block" data-act="cancelar">Cancelar</button></div>',
        function(sheet){
          sheet.addEventListener("click", function(e){
            if(e.target.closest("[data-act='confirmar']")){ doSub(outId, inId); closeSheet(); }
            if(e.target.closest("[data-act='cancelar']")) closeSheet();
          });
        }
      );
      return;
    }
    doSub(outId, inId);
  }
  function sortByPositionMatch(list, refPos){
    return list.slice().sort(function(a,b){
      var am = (a.pos===refPos)?0:1, bm = (b.pos===refPos)?0:1;
      return am - bm;
    });
  }
  function openSubPicker(outId){
    var outP = playerById(outId);
    var bench = sortByPositionMatch(benchIds().map(playerById).filter(Boolean), outP && outP.pos);
    if(bench.length===0){ toast("Não há suplentes convocados no banco"); return; }
    openSheet(
      '<h3>Quem entra?</h3><div class="sub">Sai #'+esc(outP.num)+' '+esc(outP.name)+' ('+esc(outP.pos)+') — sugeridos primeiro os da mesma posição</div>'+
      '<div class="pgrid">'+bench.map(function(p){
        return '<div class="pchip" data-in="'+p.id+'"><div class="n">#'+esc(p.num)+'</div><div class="nm">'+esc(p.name)+'</div><div class="pos">'+esc(posAbbr(p))+'</div></div>';
      }).join("")+'</div>'+
      '<div class="btn-row" style="margin-top:14px;"><button class="btn ghost block" data-act="fechar">Cancelar</button></div>',
      function(sheet){
        sheet.addEventListener("click", function(e){
          var chip = e.target.closest("[data-in]");
          if(chip){ var inId=chip.getAttribute("data-in"); closeSheet(); attemptSub(outId, inId); return; }
          if(e.target.closest("[data-act='fechar']")) closeSheet();
        });
      }
    );
  }
  function openEntraPicker(inId){
    var inP = playerById(inId);
    if(state.onCourt.length<5){
      state.onCourt.push(inId);
      if(state.clock.running) markOnSince(inId, nowElapsedMs());
      var ev = logEvent("substituicao", inId, {outId:null});
      pushUndo(function(){
        state.events = state.events.filter(function(e){return e.id!==ev.id;});
        state.onCourt = state.onCourt.filter(function(id){return id!==inId;});
      });
      save(); render();
      toast("Entrou em campo");
      return;
    }
    var onc = sortByPositionMatch(state.onCourt.map(playerById).filter(Boolean), inP && inP.pos);
    openSheet(
      '<h3>Quem sai?</h3><div class="sub">Quadra completa (5) — escolhe quem sai para entrar #'+esc(inP.num)+' ('+esc(inP.pos)+')</div>'+
      '<div class="pgrid">'+onc.map(function(p){
        return '<div class="pchip" data-out="'+p.id+'"><div class="n">#'+esc(p.num)+'</div><div class="nm">'+esc(p.name)+'</div><div class="pos">'+esc(posAbbr(p))+'</div></div>';
      }).join("")+'</div>'+
      '<div class="btn-row" style="margin-top:14px;"><button class="btn ghost block" data-act="fechar">Cancelar</button></div>',
      function(sheet){
        sheet.addEventListener("click", function(e){

          if(chip){ var outId=chip.getAttribute("data-out"); closeSheet(); attemptSub(outId, inId); return; }
          if(e.target.closest("[data-act='fechar']")) closeSheet();
        });
      }
    );
  }

  // ================= RENDER =================
  function render(){
    document.querySelectorAll(".tab").forEach(function(t){
      t.classList.toggle("active", t.getAttribute("data-tab")===state.activeTab);
    });
    var view = document.getElementById("view");
    if(state.activeTab==="plantel") view.innerHTML = renderPlantel();
    else if(state.activeTab==="prejogo") view.innerHTML = renderPreJogo();
    else if(state.activeTab==="jogo") view.innerHTML = renderJogo();
    else view.innerHTML = renderResumo();
    bindViewEvents();
    renderTray();
  }

  function renderTray(){
    var old = document.querySelector(".tray"); if(old) old.remove();
    if(state.activeTab!=="jogo" || !state.match) return;
    var tray = document.createElement("div");
    tray.className = "tray";
    tray.innerHTML =
      '<button class="btn" id="trayUndo">↩️ Desfazer</button>'+
      '<button class="btn primary" id="trayGoal">⚽ Golo</button>'+
      '<button class="btn" id="trayLog">📋 Registo</button>';
    document.body.appendChild(tray);
    document.getElementById("trayUndo").onclick = doUndo;
    document.getElementById("trayGoal").onclick = openGoalSheet;
    document.getElementById("trayLog").onclick = function(){ setTab("resumo"); };
  }

                 '<div class="n">#'+esc(p.num)+'</div><div class="nm">'+esc(p.name)+'</div><div class="pos">'+esc(posAbbr(p))+'</div></div>';
        }).join("")+'</div>')+
        '<div class="hint">Toca para marcar quem começa em quadra (máx. 5). Podes ajustar tudo depois com substituições.</div>'+
        '<button class="btn primary block" id="btnGoLive" style="margin-top:12px;" '+((state.onCourt.length===0)?'disabled':'')+'>Ir para o jogo →</button>'+
      '</div>';
  }

  function renderJogo(){
    if(!state.match || state.match.convocadoIds.length===0){
      return '<div class="card"><div class="empty">Configura o jogo na aba <b>Pré‑Jogo</b> primeiro.</div></div>';
    }
    var onc = state.onCourt.map(playerById).filter(Boolean);
    var bench = benchIds().map(playerById).filter(Boolean);
    var clockRunning = state.clock.running;
    var t = state.treatment;
    return ''+
      '<div class="scoreboard">'+
        '<div class="score-side"><div class="lbl">Nós</div><div class="val num">'+state.score.nos+'</div></div>'+
        '<div class="clock-mid">'+
          '<div class="lbl" style="margin-bottom:2px;">'+esc(periodLabel(state.period))+'</div>'+
          '<div class="time num" id="clockTime">'+fmtMinSec(nowElapsedMs())+'</div>'+
          '<button class="clock-btn" id="btnClock">'+clockButtonLabel()+'</button>'+
        '</div>'+
        '<div class="score-side"><div class="lbl">'+esc(state.match.adversario||"Advers.")+'</div><div class="val num">'+state.score.advers+'</div>'+
          '<button class="oppgoal" id="btnOppGoal">+1 golo advers.</button></div>'+
      '</div>'+
      '<div class="btn-row" style="margin-top:8px;"><button class="btn sm ghost" id="btnCorrigir">✏️ Corrigir placar / adicionar evento esquecido</button></div>'+
      (t ? '<div class="card" style="border-color:var(--red);">🩹 Atendimento em curso: <b>'+esc((playerById(t.playerId)||{}).name||"")+'</b> — <button class="btn sm" id="btnEndTreatFromTop">Terminar</button></div>' : '')+
      '<div class="card">'+
        '<div class="section-title">Em campo ('+onc.length+')</div>'+
        (onc.length===0 ? '<div class="empty">Ninguém em quadra</div>' :
        '<div class="pgrid">'+onc.map(function(p){ return playerChip(p, true); }).join("")+'</div>')+
      '</div>'+
      '<div class="card">'+
        '<div class="section-title">Banco ('+bench.length+')</div>'+
        (bench.length===0 ? '<div class="empty">Sem suplentes disponíveis</div>' :
        '<div class="pgrid">'+bench.map(function(p){ return playerChip(p, false); }).join("")+'</div>')+
      '</div>'+
      '<div class="card">'+
        '<div class="section-title">'+esc(periodLabel(state.period))+' · Faltas: '+state.periodFouls+'</div>'+
        '<div class="hint">Pausas só com motivo (pedido de tempo). Quando a parte acabar, usa o botão abaixo — o relógio da parte seguinte começa do 00:00.</div>'+
        '<button class="btn block" id="btnEndPeriod" style="margin-top:10px;">Terminar '+esc(periodLabel(state.period))+'</button>'+
      '</div>';
  }

  function posAbbr(p){ return (p && POS_ABBR[p.pos]) || "UN"; }
  function playerChip(p, onCourt){
    var yc = state.events.filter(function(e){return e.type==="cartao_amarelo" && e.playerId===p.id;}).length;
    var rc = state.events.filter(function(e){return e.type==="cartao_vermelho" && e.playerId===p.id;}).length;
    var inTreat = state.treatment && state.treatment.playerId===p.id;
    var mins = Math.floor(playerSeconds(p.id)/60);
    return '<div class="pchip" data-player="'+p.id+'">'+
      '<div class="badges">'+(yc?'<span class="b y"></span>':'')+(rc?'<span class="b r"></span>':'')+'</div>'+
      (inTreat?'<span class="inj">🩹</span>':'')+
      '<div class="n">#'+esc(p.num)+'</div><div class="nm">'+esc(p.name)+'</div>'+
      '<div class="pos">'+esc(posAbbr(p))+'</div>'+
      (onCourt?'<div class="min">'+mins+"'</div>":'')+
      '</div>';
  }

  function renderResumo(){
    var rows = buildRows();
    return ''+
      '<div class="card">'+
        '<div class="section-title">Resumo — '+esc(state.match?state.match.adversario||"Jogo":"Jogo")+'</div>'+
        '<div class="tablewrap"><table><thead><tr>'+
          '<th>Atleta</th><th class="num">Conv.</th><th class="num">Tit.</th><th class="num">Min</th><th class="num">G</th><th class="num">A</th><th class="num">CA</th><th class="num">CV</th>'+
        '</tr></thead><tbody>'+
        rows.map(function(r){
          return '<tr><td>#'+esc(r.num)+' '+esc(r.nome)+'</td><td class="num">'+r.convocado+'</td><td class="num">'+r.titular+'</td>'+
                 '<td class="num">'+r.min+'</td><td class="num">'+r.golos+'</td><td class="num">'+r.assist+'</td>'+
                 '<td class="num">'+r.ca+'</td><td class="num">'+r.cv+'</td></tr>';
        }).join("")+
        '</tbody></table></div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="section-title">Exportar para o workbook</div>'+
        '<div class="btn-row">'+
          '<button class="btn primary" id="btnCopy">📋 Copiar resumo</button>'+
          '<button class="btn" id="btnDownload">⬇️ Descarregar cópia</button>'+
        '</div>'+
        '<div class="hint">Copia e cola aqui no chat — eu lanço os dados na folha "Jogo - Registo" e o "Resumo Época" atualiza-se sozinho.</div>'+
        '<textarea class="exportbox" id="exportArea" readonly>'+esc(exportText())+'</textarea>'+
      '</div>'+
      '<div class="card">'+
        '<div class="section-title">Registo cronológico ('+state.events.length+')</div>'+
        (state.events.length===0 ? '<div class="empty">Ainda sem eventos</div>' :
          state.events.slice().reverse().map(function(e){
            return '<div class="logline"><div class="t">'+eventStamp(e)+(e.correcao?' <span class="pill">correção</span>':'')+'</div><div class="d">'+esc(describeEvent(e))+'</div></div>';
          }).join(""))+
      '</div>'+
      (state.match ? '<div class="card"><button class="btn block" id="btnArchive">Terminar e guardar este jogo</button>'+
        '<div class="hint">Arquiva o jogo no histórico e prepara a app para o próximo, mantendo o plantel.</div></div>' : '');
  }

  // ---------- event binding ----------
  function bindViewEvents(){
    var view = document.getElementById("view");

    var addBtn = document.getElementById("btnAddPlayer");
    if(addBtn) addBtn.onclick = function(){
      addPlayer(document.getElementById("inNum").value, document.getElementById("inName").value, document.getElementById("inPos").value);
    };
    var importBtn = document.getElementById("btnImportRoster");
    if(importBtn) importBtn.onclick = function(){
      var ta = document.getElementById("importRosterArea");
      if(ta && ta.value.trim()){ importRosterFromText(ta.value); ta.value=""; }
      else { toast("Cola primeiro o texto copiado do Excel"); }
    };
    var syncBtn = document.getElementById("btnSyncGithub");
    if(syncBtn) syncBtn.onclick = function(){ syncPlantelFromGithub(true); };
    var btnBkDown = document.getElementById("btnBackupDownload");
    if(btnBkDown) btnBkDown.onclick = downloadBackup;
    var btnBkRestore = document.getElementById("btnBackupRestoreTrigger");
    var bkInput = document.getElementById("backupFileInput");
    if(btnBkRestore && bkInput) btnBkRestore.onclick = function(){ bkInput.click(); };
    if(bkInput) bkInput.onchange = function(){
      var f = bkInput.files && bkInput.files[0];
      if(!f) return;
      var reader = new FileReader();
      reader.onload = function(){ confirmRestoreBackup(reader.result); bkInput.value=""; };
      reader.readAsText(f);
    };
    view.querySelectorAll("[data-rm]").forEach(function(b){
      b.onclick = function(){ removePlayer(b.getAttribute("data-rm")); };
    });
    view.querySelectorAll("[data-hist]").forEach(function(b){
      b.onclick = function(){ openHistorySheet(b.getAttribute("data-hist")); };
    });

    ["mJornada","mDate","mAdv","mLocal"].forEach(function(id, i){
      var el = document.getElementById(id); if(!el) return;
      var field = ["jornada","date","adversario","local"][i];
      el.addEventListener("change", function(){ startMatchInfo(field, el.value); });
      el.addEventListener("blur", function(){ startMatchInfo(field, el.value); });
    });
    view.querySelectorAll("[data-conv]").forEach(function(chip){
      chip.onclick = function(){ toggleConvocado(chip.getAttribute("data-conv")); };
    });
    view.querySelectorAll("[data-tit]").forEach(function(chip){
      chip.onclick = function(){ toggleTitular(chip.getAttribute("data-tit")); };
    });
    var goLive = document.getElementById("btnGoLive");
    if(goLive) goLive.onclick = function(){
      state.titularIds = state.onCourt.slice();
      save();
      setTab("jogo");
    };

    var btnClock = document.getElementById("btnClock");
    if(btnClock) btnClock.onclick = toggleClock;
    var btnOpp = document.getElementById("btnOppGoal");
    if(btnOpp) btnOpp.onclick = doOppGoal;
    var btnCorr = document.getElementById("btnCorrigir");
    if(btnCorr) btnCorr.onclick = openCorrectionSheet;
    var btnEndPeriod = document.getElementById("btnEndPeriod");
    if(btnEndPeriod) btnEndPeriod.onclick = endPeriod;
    var btnEndTreatTop = document.getElementById("btnEndTreatFromTop");
    if(btnEndTreatTop) btnEndTreatTop.onclick = endTreatment;

    view.querySelectorAll("[data-player]").forEach(function(chip){
      chip.onclick = function(){ openPlayerSheet(chip.getAttribute("data-player")); };
    });

    var btnCopy = document.getElementById("btnCopy");
    if(btnCopy) btnCopy.onclick = copyExport;
    var btnDownload = document.getElementById("btnDownload");
    if(btnDownload) btnDownload.onclick = downloadCsv;
    var btnArchive = document.getElementById("btnArchive");
    if(btnArchive) btnArchive.onclick = archiveMatch;
  }

  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){ setTab(t.getAttribute("data-tab")); });
  });

  // live clock ticking while on "jogo" tab and running
  setInterval(function(){
    if(state.activeTab==="jogo" && state.clock.running){
      var el = document.getElementById("clockTime");
      if(el) el.textContent = fmtMinSec(nowElapsedMs());
      // update per-player minute badges roughly every 30s worth of ticks to avoid full re-render cost
    }
  }, 1000);

  function start(initial){
    if(initial && Object.keys(initial).length){
      state = Object.assign(defaultState(), initial);
    }
    render();
    syncPlantelFromGithub(false); // tentativa silenciosa; não bloqueia o arranque nem falha visivelmente
  }
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return state; });
    window.claude.hot.ready ? window.claude.hot.ready(start) : start(window.claude.hot.data||{});
  } else {
    start();
  }
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('Service worker não registou:', e);
      });
    });
  }
</script>
</body></html>
